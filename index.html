<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中醫考題練習 · 題庫</title>
<style>
:root{
  --ink:#0a0c0e;
  --ink-2:#12161a;
  --paper:#f3ecdf;
  --paper-dim:#cdc4b3;
  --gold:#c8a96a;
  --gold-dim:rgba(200,169,106,.28);
  --jade:#7fc2ad;
  --cinnabar:#c2554a;
  --ok:#5fae8c;
  --bad:#c2554a;
  --line:rgba(200,169,106,.22);
  --glass:rgba(243,236,223,.045);
  --glass-2:rgba(243,236,223,.08);
  --shadow:0 24px 60px -30px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.03) inset;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;line-height:1.7;letter-spacing:.02em;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 18% -10%, rgba(200,169,106,.13), transparent 62%),
    radial-gradient(900px 560px at 88% 8%, rgba(127,194,173,.10), transparent 60%),
    radial-gradient(800px 700px at 50% 110%, rgba(194,85,74,.10), transparent 65%),
    linear-gradient(180deg,#0a0c0e 0%, #0d1114 45%, #0a0c0e 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px);
  mix-blend-mode:overlay;
}
.app{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:34px 20px 72px}

/* ── header ── */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;flex-direction:column;gap:6px}
.seal{
  display:inline-flex;align-items:center;gap:10px;
}
.seal-mark{
  width:38px;height:38px;border-radius:9px;
  background:linear-gradient(150deg,#c2554a,#8f2f28);
  box-shadow:0 8px 22px -10px rgba(194,85,74,.9), 0 0 0 1px rgba(255,255,255,.10) inset;
  display:grid;place-items:center;font-size:19px;letter-spacing:.06em;color:#ffeede;
}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.14em}
.sub{font-size:12px;color:var(--paper-dim);letter-spacing:.22em;text-transform:uppercase}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{
  font-size:11.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(12px);color:var(--paper-dim);letter-spacing:.08em;
}

/* ── glass panel ── */
.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(20px) saturate(1.15);box-shadow:var(--shadow);
  padding:26px 26px 24px;position:relative;overflow:hidden;
}
.panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(140deg,rgba(255,255,255,.07),transparent 38%,transparent 62%,rgba(255,255,255,.03));
}
.sec-title{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.sec-title .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.sec-title h2{margin:0;font-size:14px;font-weight:500;letter-spacing:.18em;color:var(--paper)}
.sec-title .hint{margin-left:auto;font-size:11.5px;color:var(--paper-dim);letter-spacing:.1em}

/* ── subject ── */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.subj{
  border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);
  padding:13px 14px;text-align:left;font-family:var(--serif);color:var(--paper);
  cursor:pointer;transition:.28s cubic-bezier(.22,.61,.36,1);position:relative;
}
.subj .n{font-size:17px;letter-spacing:.06em}
.subj .m{font-size:11px;color:var(--paper-dim);letter-spacing:.06em;margin-top:4px}
.subj.on{border-color:rgba(200,169,106,.62);background:linear-gradient(150deg,rgba(200,169,106,.14),rgba(200,169,106,.03));box-shadow:0 10px 30px -18px rgba(200,169,106,.8)}
.subj.lock{opacity:.44;cursor:not-allowed}
.subj .cnt{position:absolute;right:12px;top:11px;font-size:11px;color:var(--gold);letter-spacing:.06em}

/* ── chips ── */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  font-family:var(--serif);cursor:pointer;border-radius:999px;padding:8px 14px;font-size:13.5px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--paper-dim);
  transition:.22s ease;display:inline-flex;align-items:center;gap:7px;
}
.chip:hover{border-color:rgba(200,169,106,.5);color:var(--paper)}
.chip.on{background:linear-gradient(150deg,rgba(127,194,173,.20),rgba(127,194,173,.05));border-color:rgba(127,194,173,.55);color:#dff3ea}
.chip .c{font-size:11px;opacity:.72}

/* ── rows ── */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toggle{
  font-family:var(--serif);cursor:pointer;border-radius:12px;padding:9px 15px;font-size:13.5px;
  border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--paper-dim);transition:.22s;
}
.toggle.on{background:linear-gradient(150deg,rgba(194,85,74,.24),rgba(194,85,74,.06));border-color:rgba(194,85,74,.55);color:#ffe4dd}

/* ── CTA ── */
.cta{
  position:relative;border:0;cursor:pointer;font-family:var(--serif);letter-spacing:.16em;
  padding:16px 34px;border-radius:14px;font-size:15.5px;color:#1a1206;
  background:linear-gradient(155deg,#e2c98f,#c8a96a 46%,#a98a4c);
  box-shadow:0 18px 40px -20px rgba(200,169,106,.95), 0 1px 0 rgba(255,255,255,.5) inset;
  transition:transform .22s cubic-bezier(.22,.61,.36,1), box-shadow .28s, filter .2s;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 24px 50px -22px rgba(200,169,106,1), 0 1px 0 rgba(255,255,255,.55) inset;filter:brightness(1.04)}
.cta:active{transform:translateY(0) scale(.99)}
.cta.ghost{
  background:transparent;color:var(--paper);border:1px solid var(--line);
  box-shadow:none;letter-spacing:.12em;
}
.cta.ghost:hover{border-color:rgba(200,169,106,.6);background:rgba(200,169,106,.08)}
.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}
.note{margin-left:auto;font-size:11.5px;color:var(--paper-dim);letter-spacing:.1em}

/* ── quiz ── */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.progress{flex:1;min-width:180px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.progress > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--jade),var(--gold));transition:width .5s cubic-bezier(.22,.61,.36,1)}
.qcount{font-size:12px;color:var(--paper-dim);letter-spacing:.16em;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--paper-dim);letter-spacing:.1em}
.tag.gold{color:var(--gold);border-color:rgba(200,169,106,.4)}
.casebox{
  border-radius:14px;border:1px solid rgba(200,169,106,.28);border-left:3px solid rgba(200,169,106,.6);
  background:linear-gradient(150deg,rgba(200,169,106,.10),rgba(200,169,106,.02));
  padding:15px 18px;margin:0 0 16px;font-size:14.5px;line-height:1.9;color:#efe7d6;
}
.casebox::before{content:"病 案";display:block;font-size:10.5px;letter-spacing:.34em;color:var(--gold);margin-bottom:7px;opacity:.9}
.grouplabel{font-size:11.5px;letter-spacing:.2em;color:var(--gold);margin:0 0 10px;opacity:.85}
.stem{font-size:19px;line-height:1.95;letter-spacing:.03em;margin:6px 0 22px;color:#fbf6ea}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;
  font-family:var(--serif);font-size:15.5px;line-height:1.7;color:#ece4d5;
  background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:14px;
  padding:15px 17px;transition:.24s cubic-bezier(.22,.61,.36,1);position:relative;
}
.opt:hover:not(.done){background:rgba(200,169,106,.09);border-color:rgba(200,169,106,.40);transform:translateX(3px)}
.opt .k{
  flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:var(--paper-dim);
  transition:.24s;
}
.opt.right{background:linear-gradient(150deg,rgba(95,174,140,.22),rgba(95,174,140,.05));border-color:rgba(95,174,140,.65);box-shadow:0 12px 34px -22px rgba(95,174,140,.9)}
.opt.right .k{background:rgba(95,174,140,.35);border-color:rgba(95,174,140,.7);color:#eafff6}
.opt.wrong{background:linear-gradient(150deg,rgba(194,85,74,.24),rgba(194,85,74,.05));border-color:rgba(194,85,74,.65)}
.opt.wrong .k{background:rgba(194,85,74,.36);border-color:rgba(194,85,74,.7);color:#ffe9e5}
.opt.done{cursor:default}

.explain{
  margin-top:18px;border-radius:14px;border:1px solid var(--line);border-left:2px solid rgba(200,169,106,.55);
  background:linear-gradient(150deg,rgba(243,236,223,.075),rgba(243,236,223,.025));
  padding:16px 18px 17px;opacity:0;transform:translateY(8px);transition:.4s cubic-bezier(.22,.61,.36,1);
}
.explain.show{opacity:1;transform:none}
.explain .h{font-size:11.5px;letter-spacing:.22em;color:var(--gold);margin-bottom:7px}
.explain p{margin:0;font-size:15px;color:#eee4d2;line-height:1.9}
.verdict{font-size:13.5px;letter-spacing:.16em;margin-bottom:11px;font-weight:600}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--bad)}

/* ── result ── */
.score-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{display:block;font-size:34px;font-weight:600;letter-spacing:.04em}
.ring .num span{font-size:11px;color:var(--paper-dim);letter-spacing:.18em}
.stats{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
.stat{display:flex;justify-content:space-between;font-size:13.5px;color:var(--paper-dim);border-bottom:1px dashed rgba(255,255,255,.09);padding-bottom:9px}
.stat b{color:var(--paper);font-weight:500;letter-spacing:.06em}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--paper-dim)}
.bar-row .lb{width:96px;flex:none;letter-spacing:.06em}
.bar-row .bar{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),rgba(127,194,173,.45));width:0;transition:width .6s}
.bar-row .v{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--paper)}

.wrong-list{margin-top:6px;display:flex;flex-direction:column;gap:9px}
.wrong-item{border:1px solid rgba(194,85,74,.3);border-radius:13px;background:rgba(194,85,74,.06);padding:13px 16px}
.wrong-item .q{font-size:14px;color:#f4ecdd;line-height:1.75}
.wrong-item .meta{font-size:11px;color:var(--paper-dim);letter-spacing:.1em;margin-bottom:6px}
.wrong-item .ans{font-size:12.5px;color:var(--jade);margin-top:8px}
.wrong-item .exp{font-size:12.5px;color:var(--paper-dim);margin-top:4px;line-height:1.7}

.hidden{display:none!important}
.fade-in{animation:fadeUp .55s cubic-bezier(.22,.61,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:600px){
  h1{font-size:21px}
  .panel{padding:20px 17px}
  .stem{font-size:17px}
  .opt{font-size:14.5px;padding:13px 14px}
  .app{padding:22px 14px 56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="seal"><span class="seal-mark">診</span><h1>中醫考題練習</h1></div>
      <div class="sub">Question Bank · 依大陸規劃教材</div>
    </div>
    <div class="badge-row">
      <span class="badge" id="totalBadge">題庫載入中</span>
      <span class="badge">十二五／十五五 共通考點</span>
    </div>
  </header>

  <!-- 設定 -->
  <section id="setup">
    <div class="panel fade-in">
      <div class="sec-title"><span class="dot"></span><h2>科目</h2><span class="hint">九科已全數開放</span></div>
      <div class="subjects" id="subjectList"></div>

      <div class="sec-title" style="margin-top:26px"><span class="dot"></span><h2>章節</h2><span class="hint" id="chHint"></span></div>
      <div class="chips" id="chapterChips"></div>

      <div class="sec-title" style="margin-top:26px"><span class="dot"></span><h2>練習方式</h2></div>
      <div class="row" id="optRow">
        <button class="toggle" data-limit="0">全部</button>
        <button class="toggle" data-limit="10">10 題</button>
        <button class="toggle" data-limit="20">20 題</button>
        <button class="toggle" data-limit="30">30 題</button>
        <button class="toggle" data-limit="50">50 題</button>
        <span style="width:14px"></span>
        <button class="toggle" id="btnShuffle">隨機排序</button>
        <button class="toggle" id="btnWrongOnly">只練錯題</button>
      </div>

      <div class="footer-actions">
        <button class="cta" id="btnStart">開 始 練 習</button>
        <button class="cta ghost" id="btnReset">清除紀錄</button>
        <span class="note" id="pickInfo"></span>
      </div>
    </div>
  </section>

  <!-- 作答 -->
  <section id="quiz" class="hidden">
    <div class="panel">
      <div class="topbar">
        <span class="qcount" id="qcount">01 / 20</span>
        <div class="progress"><i id="bar"></i></div>
        <span class="qcount" id="accLive">正確率 —</span>
      </div>
      <div class="tags" id="qTags"></div>
      <div id="caseBox"></div>
      <div class="stem" id="stem"></div>
      <div class="opts" id="opts"></div>
      <div class="explain" id="explain">
        <div class="verdict" id="verdict"></div>
        <div class="h">解析</div>
        <p id="expText"></p>
      </div>
      <div class="footer-actions">
        <button class="cta" id="btnNext">下一題</button>
        <span class="note">按 1–4 作答 · Enter 前進</span>
      </div>
    </div>
  </section>

  <!-- 成績 -->
  <section id="result" class="hidden">
    <div class="panel fade-in">
      <div class="sec-title"><span class="dot"></span><h2>本回成績</h2><span class="hint" id="resHint"></span></div>
      <div class="score-wrap">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/>
            <circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="url(#g)" stroke-width="9"
                    stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7fc2ad"/><stop offset="100%" stop-color="#c8a96a"/>
            </linearGradient></defs>
          </svg>
          <div class="num"><div><b id="scoreNum">0</b><span>正確率</span></div></div>
        </div>
        <div class="stats">
          <div class="stat"><span>作答題數</span><b id="sTotal">—</b></div>
          <div class="stat"><span>答對</span><b id="sRight">—</b></div>
          <div class="stat"><span>答錯</span><b id="sWrong">—</b></div>
          <div class="stat" style="border:0;padding:0"><span>累計錯題（含以往）</span><b id="sPool">—</b></div>
        </div>
      </div>

      <div class="sec-title" style="margin-top:28px"><span class="dot"></span><h2>章節表現</h2></div>
      <div class="bars" id="bars"></div>

      <div class="sec-title" style="margin-top:28px"><span class="dot"></span><h2>錯題回顧</h2></div>
      <div class="wrong-list" id="wrongList"></div>

      <div class="footer-actions">
        <button class="cta" id="btnAgainWrong">再練錯題</button>
        <button class="cta ghost" id="btnRestart">回設定</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  const LS = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const SUBJECTS = window.TCM_SUBJECTS || [];
  const ALL = window.TCM_QUESTIONS || [];

  const CHAPTER_MAP = {
    diagnosis: ["緒論","望診","舌診","聞診","問診","切診","八綱辨證","病性辨證","病位辨證","診斷思維與應用","醫案與病歷"],
    internal: ["肺系病證","心腦系病證","脾胃系病證","肝膽系病證","腎系病證","氣血津液病證","肢體經絡病證"],
    basic: ["緒論","哲學基礎","藏象","精氣血津液","經絡","體質","病因","病機","防治原則","養生"],
    materia: ["總論","解表藥","清熱藥","瀉下與祛風濕藥","化濕與利水滲濕藥","溫裡與理氣藥","消食與驅蟲藥","止血與活血化瘀藥","化痰止咳平喘藥","安神與平肝息風藥","開竅與補虛藥","收澀與其他"],
    formula: ["總論","解表劑","瀉下與和解劑","清熱與祛暑劑","溫裡與補益劑","固澀與安神劑","理氣與理血劑","治風與治燥劑","祛濕與祛痰劑","消食與其他"],
    acupuncture: ["經絡腧穴總論","腧穴各論","刺灸法","針灸治療總論","針灸治療各論"],
    surgery: ["總論","瘡瘍","乳房疾病","癭與瘤岩","皮膚病","肛門直腸病","周圍血管病"],
    pediatrics: ["總論","新生兒疾病","肺系病證","脾系病證","心肝系病證","腎系病證","時行疾病"],
    gynecology: ["總論","月經病","帶下病","妊娠病","產後病","婦科雜病"]
  };
  let ACTIVE = "diagnosis";
  let Q = [];
  let chapters = [];

  function useSubject(sid){
    ACTIVE = sid;
    Q = ALL.filter(q => q.sub === sid);
    const order = CHAPTER_MAP[sid] || [];
    chapters = order.filter(c => Q.some(q => q.ch === c))
      .concat([...new Set(Q.map(q => q.ch))].filter(c => !order.includes(c)));
    state.chapters = new Set(chapters);
  }

  const $ = s => document.querySelector(s);
  const state = {
    chapters: new Set(chapters),
    limit: 0,
    shuffle: true,
    wrongOnly: false,
    queue: [], idx: 0, answered: false, results: []
  };
  let wrongPool = LS.get("tcm_wrong_v1", {});   // {id: times}

  /* ── 設定畫面 ── */
  function renderSubjects(){
    $("#subjectList").innerHTML = SUBJECTS.map(s => {
      const on = s.id === ACTIVE;
      const cnt = ALL.filter(q => q.sub === s.id).length;
      return `<button class="subj ${on?'on':''} ${s.open?'':'lock'}" ${s.open?'':'disabled'} data-sid="${s.id}">
        <div class="n">${s.name}</div>
        <div class="m">${s.open ? s.base : '題庫待建'}</div>
        <div class="cnt">${cnt ? cnt + ' 題' : '—'}</div>
      </button>`;
    }).join("");
    $("#subjectList").querySelectorAll(".subj").forEach(el=>{
      el.onclick = () => selectSubject(el.dataset.sid);
    });
  }

  function selectSubject(sid){
    if(sid === ACTIVE) return;
    useSubject(sid);
    renderSubjects();
    renderChips();
    renderOptionToggles();
    refreshInfo();
    updateBadge();
  }

  function updateBadge(){
    const s = SUBJECTS.find(x => x.id === ACTIVE) || {name:""};
    $("#totalBadge").textContent = `${s.name} ${Q.length} 題`;
  }

  function renderChips(){
    $("#chapterChips").innerHTML = chapters.map(c => {
      const n = Q.filter(q => q.ch === c).length;
      const on = state.chapters.has(c);
      return `<button class="chip ${on?'on':''}" data-ch="${c}">${c}<span class="c">${n}</span></button>`;
    }).join("");
    $("#chapterChips").querySelectorAll(".chip").forEach(el=>{
      el.onclick = () => {
        const c = el.dataset.ch;
        state.chapters.has(c) ? state.chapters.delete(c) : state.chapters.add(c);
        renderChips(); refreshInfo();
      };
    });
    $("#chHint").textContent = `已選 ${state.chapters.size} / ${chapters.length} 章`;
  }

  function selectedQuestions(){
    let pool = Q.filter(q => state.chapters.has(q.ch));
    if(state.wrongOnly){
      const ids = new Set(Object.keys(wrongPool));
      pool = pool.filter(q => ids.has(q.id));
    }
    return pool;
  }

  function refreshInfo(){
    const pool = selectedQuestions();
    const n = state.limit ? Math.min(state.limit, pool.length) : pool.length;
    $("#pickInfo").textContent = `本次可練 ${n} 題 · 錯題池 ${Object.keys(wrongPool).length} 題`;
    $("#btnStart").disabled = n === 0;
    $("#btnStart").style.opacity = n === 0 ? .45 : 1;
  }

  function renderOptionToggles(){
    $("#optRow").querySelectorAll("[data-limit]").forEach(b=>{
      b.classList.toggle("on", Number(b.dataset.limit) === state.limit);
    });
    $("#btnShuffle").classList.toggle("on", state.shuffle);
    $("#btnWrongOnly").classList.toggle("on", state.wrongOnly);
  }

  $("#optRow").addEventListener("click", e=>{
    const b = e.target.closest("[data-limit]");
    if(b){ state.limit = Number(b.dataset.limit); renderOptionToggles(); refreshInfo(); }
  });
  $("#btnShuffle").onclick = () => { state.shuffle = !state.shuffle; renderOptionToggles(); };
  $("#btnWrongOnly").onclick = () => { state.wrongOnly = !state.wrongOnly; renderOptionToggles(); refreshInfo(); };

  $("#btnReset").onclick = () => {
    wrongPool = {}; LS.set("tcm_wrong_v1", wrongPool); refreshInfo();
    const btn = $("#btnReset");
    btn.textContent = "已清除";
    setTimeout(()=>{ btn.textContent = "清除紀錄"; }, 1400);
  };

  /* ── 開始 ── */
  $("#btnStart").onclick = () => {
    let pool = selectedQuestions().slice();
    if(state.shuffle){
      for(let i = pool.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
    if(state.limit) pool = pool.slice(0, state.limit);
    if(!pool.length) return;
    state.queue = pool; state.idx = 0; state.results = [];
    $("#setup").classList.add("hidden");
    $("#result").classList.add("hidden");
    $("#quiz").classList.remove("hidden");
    $("#quiz").scrollIntoView({behavior:"smooth", block:"start"});
    renderQuestion();
  };

  /* ── 作答 ── */
  function renderQuestion(){
    const q = state.queue[state.idx];
    state.answered = false;
    $("#qcount").textContent = `${String(state.idx+1).padStart(2,"0")} / ${String(state.queue.length).padStart(2,"0")}`;
    $("#bar").style.width = ((state.idx) / state.queue.length * 100) + "%";
    const acc = state.results.length ? Math.round(state.results.filter(r=>r.ok).length / state.results.length * 100) : null;
    $("#accLive").textContent = acc === null ? "正確率 —" : `正確率 ${acc}%`;

    const TYPE_LABEL = {A1:"A1 單選", A2:"A2 病案", B1:"B1 配伍", A3:"A3 病例組"};
    $("#qTags").innerHTML =
      `<span class="tag gold">${q.ch}</span>` +
      `<span class="tag">${TYPE_LABEL[q.type] || q.type}</span>` +
      `<span class="tag">難度 ${"◆".repeat(q.diff)}${"◇".repeat(3-q.diff)}</span>` +
      `<span class="tag">${q.id}</span>`;
    $("#caseBox").innerHTML =
      (q.case ? `<div class="casebox">${q.case}</div>` : "") +
      (q.groupLabel ? `<div class="grouplabel">${q.groupLabel}</div>` : "");
    $("#stem").textContent = q.stem;
    $("#opts").innerHTML = q.opts.map((o,i)=>
      `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${o}</span></button>`).join("");
    $("#opts").querySelectorAll(".opt").forEach(el=>{
      el.onclick = () => answer(Number(el.dataset.i));
    });
    $("#explain").classList.remove("show");
    $("#btnNext").textContent = state.idx === state.queue.length - 1 ? "看 成 績" : "下 一 題";
    $("#btnNext").disabled = true;
    $("#btnNext").style.opacity = .45;
  }

  let lastQueue = [];

  function answer(i){
    if(state.answered) return;
    const q = state.queue[state.idx];
    state.answered = true;
    const right = "ABCD".indexOf(q.ans);
    const ok = i === right;
    lastQueue = state.queue.slice(state.idx, state.idx + 5);

    $("#opts").querySelectorAll(".opt").forEach((el,k)=>{
      el.classList.add("done");
      if(k === right) el.classList.add("right");
      if(k === i && !ok) el.classList.add("wrong");
    });

    const v = $("#verdict");
    v.className = "verdict " + (ok ? "ok" : "no");
    v.textContent = ok ? "答對" : `答錯 · 正確答案 ${q.ans}`;
    $("#expText").textContent = q.exp;
    $("#explain").classList.add("show");

    state.results.push({id:q.id, ch:q.ch, ok});
    if(!ok) wrongPool[q.id] = (wrongPool[q.id] || 0) + 1;
    else if(wrongPool[q.id]) delete wrongPool[q.id];
    LS.set("tcm_wrong_v1", wrongPool);

    const acc = Math.round(state.results.filter(r=>r.ok).length / state.results.length * 100);
    $("#accLive").textContent = `正確率 ${acc}%`;
    $("#bar").style.width = ((state.idx + 1) / state.queue.length * 100) + "%";

    $("#btnNext").disabled = false;
    $("#btnNext").style.opacity = 1;
  }

  $("#btnNext").onclick = () => {
    if(!state.answered) return;
    if(state.idx + 1 >= state.queue.length) return showResult();
    state.idx++; renderQuestion();
  };

  document.addEventListener("keydown", e=>{
    if($("#quiz").classList.contains("hidden")) return;
    const q = state.queue[state.idx];
    if(!q) return;
    const k = e.key.toUpperCase();
    const map = {"1":0,"2":1,"3":2,"4":3,"A":0,"B":1,"C":2,"D":3};
    if(map.hasOwnProperty(k) && !state.answered){ answer(map[k]); }
    else if((e.key === "Enter" || e.key === " ") && state.answered){ e.preventDefault(); $("#btnNext").click(); }
  });

  /* ── 成績 ── */
  function showResult(){
    const total = state.results.length;
    const okN = state.results.filter(r=>r.ok).length;
    const pct = total ? Math.round(okN / total * 100) : 0;

    $("#quiz").classList.add("hidden");
    $("#result").classList.remove("hidden");
    $("#result").scrollIntoView({behavior:"smooth", block:"start"});

    $("#scoreNum").textContent = pct + "%";
    const arc = $("#ringArc");
    arc.style.transition = "stroke-dashoffset 1s cubic-bezier(.22,.61,.36,1)";
    arc.style.strokeDashoffset = String(326.7 * (1 - pct/100));
    $("#sTotal").textContent = total + " 題";
    $("#sRight").textContent = okN + " 題";
    $("#sWrong").textContent = (total - okN) + " 題";
    $("#sPool").textContent = Object.keys(wrongPool).length + " 題";
    $("#resHint").textContent = pct >= 80 ? "水準以上" : pct >= 60 ? "尚可，補強弱章" : "基礎章節需重讀";

    const byCh = {};
    state.results.forEach(r=>{
      byCh[r.ch] = byCh[r.ch] || {n:0, ok:0};
      byCh[r.ch].n++; if(r.ok) byCh[r.ch].ok++;
    });
    $("#bars").innerHTML = Object.keys(byCh).map(c=>{
      const {n, ok} = byCh[c];
      const p = Math.round(ok/n*100);
      return `<div class="bar-row"><span class="lb">${c}</span>
        <span class="bar"><i data-w="${p}"></i></span>
        <span class="v">${ok}/${n}</span></div>`;
    }).join("") || `<div class="bar-row" style="opacity:.6">本回無資料</div>`;
    requestAnimationFrame(()=>{
      $("#bars").querySelectorAll("i[data-w]").forEach(el=>{ el.style.width = el.dataset.w + "%"; });
    });

    const wrongs = state.results.filter(r=>!r.ok).map(r=>Q.find(q=>q.id===r.id));
    $("#wrongList").innerHTML = wrongs.length ? wrongs.map(q=>{
      return `<div class="wrong-item">
        <div class="meta">${q.ch} · ${q.id}</div>
        ${q.case ? `<div class="exp" style="color:#d8cdb9">病案：${q.case}</div>` : ""}
        <div class="q">${q.stem}</div>
        <div class="ans">正解 ${q.ans} · ${q.opts["ABCD".indexOf(q.ans)]}</div>
        <div class="exp">${q.exp}</div>
      </div>`;
    }).join("") : `<div class="wrong-item" style="border-color:rgba(95,174,140,.35);background:rgba(95,174,140,.08)">
        <div class="q">本回全對，沒有錯題。</div></div>`;

    $("#btnAgainWrong").style.display = wrongs.length ? "" : "none";
    $("#btnAgainWrong").onclick = () => {
      $("#setup").classList.remove("hidden");
      $("#result").classList.add("hidden");
      state.wrongOnly = true; renderOptionToggles(); refreshInfo();
      $("#btnStart").click();
    };
  }

  $("#btnRestart").onclick = () => {
    $("#result").classList.add("hidden");
    $("#setup").classList.remove("hidden");
    refreshInfo();
    $("#setup").scrollIntoView({behavior:"smooth", block:"start"});
  };

  /* ── init ── */
  useSubject("diagnosis");
  renderSubjects();
  renderChips();
  renderOptionToggles();
  refreshInfo();
  updateBadge();
})();
</script>
</body>
</html>
